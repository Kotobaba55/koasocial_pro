<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KoaSocial - Réseau Social Professionnel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#F5F7FB] text-[#172033] font-['Inter',sans-serif] antialiased min-h-screen flex flex-col">
    <div id="app" class="flex-1 flex flex-col">
        <!-- Auth Screen -->
        <div id="auth-screen" class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-[#2563EB] via-[#1D4ED8] to-[#1E293B]">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 border border-[#E5EAF2]">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-[#2563EB] text-white rounded-2xl mx-auto flex items-center justify-center text-3xl font-black shadow-lg mb-4">K</div>
                    <h1 class="text-3xl font-extrabold text-[#172033]">KoaSocial Pro</h1>
                    <p class="text-[#64748B] mt-1.5 text-sm">Connexion à votre espace professionnel</p>
                </div>
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#64748B] mb-1.5">Email</label>
                        <input type="email" id="login-email" required placeholder="sarah@mail.com" class="w-full px-4 py-3 bg-[#F5F7FB] border border-[#E5EAF2] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2563EB]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-[#64748B] mb-1.5">Mot de passe</label>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 bg-[#F5F7FB] border border-[#E5EAF2] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#2563EB]">
                    </div>
                    <button type="submit" class="w-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm">Se connecter</button>
                </form>
            </div>
        </div>

        <!-- Main Dashboard Screen -->
        <div id="main-screen" class="hidden-section flex-1 flex flex-col bg-[#F5F7FB]">
            <header class="bg-white border-b border-[#E5EAF2] sticky top-0 z-50 shadow-xs">
                <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-[#2563EB] text-white rounded-xl flex items-center justify-center font-black text-xl">K</div>
                        <span class="text-xl font-black text-[#172033]">KoaSocial</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span id="current-username" class="font-bold text-xs text-[#172033]"></span>
                        <button onclick="logout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold">Déconnexion</button>
                    </div>
                </div>
            </header>
            <main class="flex-1 max-w-4xl w-full mx-auto p-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-[#E5EAF2] text-center space-y-4">
                    <h2 class="text-xl font-bold text-[#172033]">Bienvenue sur KoaSocial Centralisé</h2>
                    <p class="text-xs text-[#64748B]">Votre plateforme professionnelle est configurée et prête pour le déploiement sur GitHub.</p>
                </div>
            </main>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
